name: '🪟 Build WePrompt (Windows x64)'

on:
  workflow_dispatch:
    inputs:
      aioncore_ref:
        description: 'aioncore branch, tag or commit to build the backend from'
        required: true
        default: 'security/pilot-hardening-d01-d06'
        type: string

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: '1.95.0'
  RUST_TARGET: 'x86_64-pc-windows-msvc'
  AIONCORE_REPO: 'khoapnt-vng/aioncore'

jobs:
  build:
    name: Build installer
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout WePrompt (frontend)
        uses: actions/checkout@v4

      - name: Checkout aioncore (backend)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.AIONCORE_REPO }}
          ref: ${{ inputs.aioncore_ref }}
          path: aioncore-src

      - name: Setup Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ env.RUST_TARGET }}

      - name: Remove Git's link.exe so the MSVC linker wins
        shell: pwsh
        run: Remove-Item 'C:\Program Files\Git\usr\bin\link.exe' -Force -ErrorAction SilentlyContinue

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: aioncore-src
          shared-key: weprompt-win-${{ env.RUST_TARGET }}

      - name: Build aioncore.exe
        shell: bash
        working-directory: aioncore-src
        env:
          RUSTFLAGS: '-C target-feature=+crt-static'
          CARGO_TERM_COLOR: always
          CARGO_HTTP_TIMEOUT: '600'
          CARGO_NET_RETRY: '10'
          # rusqlite's `bundled-sqlcipher-vendored-openssl` feature builds OpenSSL from
          # source, and OpenSSL's ./Configure needs a Perl with Locale::Maketext::Simple.
          # Under `shell: bash` the Git-for-Windows MSYS perl wins the PATH and lacks it,
          # so point openssl-src at the runner's Strawberry Perl explicitly.
          OPENSSL_SRC_PERL: C:/Strawberry/perl/bin/perl.exe
        run: |
          set -euo pipefail
          test -f "/c/Strawberry/perl/bin/perl.exe" || {
            echo "::error::Strawberry Perl not found at C:/Strawberry/perl/bin/perl.exe — OpenSSL cannot be configured"
            exit 1
          }
          cargo build --release --target "$RUST_TARGET" -p aionui-app

      - name: Assemble the backend bundle
        shell: bash
        env:
          AIONUI_BUNDLED_MANAGED_RESOURCES: ''
        run: |
          set -euo pipefail
          BUNDLE="$GITHUB_WORKSPACE/aioncore-bundle"
          BIN="$GITHUB_WORKSPACE/aioncore-src/target/$RUST_TARGET/release/aioncore.exe"

          test -f "$BIN" || { echo "::error::aioncore.exe was not produced at $BIN"; exit 1; }

          rm -rf "$BUNDLE"
          mkdir -p "$BUNDLE"
          cp "$BIN" "$BUNDLE/aioncore.exe"

          # managed-resources/ (including its manifest.json) is generated by the
          # binary itself; verifyPreparedAioncoreBundle rejects a bundle without it.
          "$BUNDLE/aioncore.exe" --data-dir "$RUNNER_TEMP/aioncore-prepare-data" \
            prepare-managed-resources --bundle-out "$BUNDLE/managed-resources"

          test -f "$BUNDLE/managed-resources/manifest.json" || {
            echo "::error::managed-resources/manifest.json missing — bundle would be rejected"; exit 1; }

          echo "AIONUI_BACKEND_LOCAL_BUNDLE_DIR=$BUNDLE" >> "$GITHUB_ENV"
          echo "Bundle ready at $BUNDLE"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the installer
        shell: bash
        env:
          AIONUI_BACKEND_ARCH: x64
          NODE_OPTIONS: '--max-old-space-size=8192'
          npm_config_arch: x64
          npm_config_target_arch: x64
          npm_config_runtime: electron
          npm_config_disturl: https://electronjs.org/headers
          npm_config_build_from_source: 'true'
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/.cache/electron-builder
          MSVS_VERSION: 2022
          GYP_MSVS_VERSION: 2022
        run: bun run build-win:x64

      - name: Verify the backend shipped came from the local bundle
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="resources/bundled-aioncore/win32-x64/manifest.json"
          test -f "$MANIFEST" || { echo "::error::$MANIFEST missing"; exit 1; }
          cat "$MANIFEST"
          node -e "
            const m = require('./$MANIFEST');
            if (m.sourceType !== 'local-bundle') {
              console.error('::error::backend sourceType is ' + m.sourceType + ', expected local-bundle — the installer would ship an upstream build');
              process.exit(1);
            }
            console.log('backend sourceType OK: local-bundle');
          "

      - name: Locate the installer
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          INSTALLER=$(find out -maxdepth 1 -name 'WePrompt-*-win-x64.exe' -print -quit)
          test -n "$INSTALLER" || { echo "::error::no WePrompt-*-win-x64.exe found in out/"; exit 1; }
          echo "path=$INSTALLER" >> "$GITHUB_OUTPUT"
          ls -lh "$INSTALLER"

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: weprompt-win-x64
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 14
