name: '🍎 Build WePrompt (macOS x64 / Intel)'

on:
  workflow_dispatch:
    inputs:
      aioncore_ref:
        description: 'aioncore branch, tag or commit to build the backend from'
        required: true
        default: 'security/pilot-hardening-d01-d06'
        type: string
      sso_config_b64:
        description: 'Optional base64 of resources/sso-config.json to bake Microsoft SSO (tenantId+clientId). Empty leaves SSO dormant.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: '1.95.0'
  RUST_TARGET: 'x86_64-apple-darwin'
  AIONCORE_REPO: 'dto-vng/Aioncore'

jobs:
  build:
    name: Build installer
    # arm64 runner (plentiful; Intel macos-13 queues for a long time as GitHub
    # winds Intel down). aioncore is cross-compiled to x86_64 and the one step
    # that must RUN it (prepare-managed-resources) runs it through Rosetta 2,
    # installed below. electron-builder produces the x64 app on an arm64 host.
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: Checkout WePrompt (frontend)
        uses: actions/checkout@v4

      - name: Checkout aioncore (backend)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.AIONCORE_REPO }}
          ref: ${{ inputs.aioncore_ref }}
          path: aioncore-src

      - name: Setup Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ env.RUST_TARGET }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: aioncore-src
          shared-key: weprompt-mac-${{ env.RUST_TARGET }}

      - name: Build aioncore
        shell: bash
        working-directory: aioncore-src
        env:
          CARGO_TERM_COLOR: always
          CARGO_HTTP_TIMEOUT: '600'
          CARGO_NET_RETRY: '10'
          # git2/libgit2-sys vendors libgit2 statically by default, BUT if it finds a
          # system libgit2 via pkg-config (Homebrew ships one on the runner) it links
          # dynamically against /opt/homebrew/opt/libgit2 — a path absent on customer
          # Macs without Homebrew, so aioncore would fail to start there. Force the
          # vendored static build and drop any pkg-config path so nothing leaks in.
          LIBGIT2_NO_PKG_CONFIG: '1'
          PKG_CONFIG_PATH: ''
        run: |
          set -euo pipefail
          cargo build --release --target "$RUST_TARGET" -p aionui-app
          BIN="target/$RUST_TARGET/release/aioncore"
          test -f "$BIN" || { echo "::error::aioncore was not produced at $BIN"; exit 1; }
          # Portability gate: the binary must link only against system libraries.
          # Any /opt/homebrew or /usr/local dependency would break on a plain Mac.
          echo "otool -L $BIN:"; otool -L "$BIN"
          LEAK=$(otool -L "$BIN" | tail -n +2 | grep -vE "/usr/lib/|/System/Library/" || true)
          if [ -n "$LEAK" ]; then
            echo "::error::aioncore links non-system dylibs (would fail on a Mac without them):"; echo "$LEAK"; exit 1
          fi
          echo "aioncore portability OK (system libraries only)."

      - name: Install Rosetta 2 (to run the cross-built x86_64 aioncore)
        shell: bash
        run: |
          set -euo pipefail
          # prepare-managed-resources below runs the x86_64 aioncore binary. On this
          # arm64 runner that needs Rosetta 2. Idempotent — a no-op if already present.
          softwareupdate --install-rosetta --agree-to-license
          # Sanity: the x86_64 binary must actually execute here.
          arch -x86_64 /usr/bin/true && echo "Rosetta 2 ready (x86_64 execution OK)."

      - name: Assemble the backend bundle
        shell: bash
        env:
          AIONUI_BUNDLED_MANAGED_RESOURCES: ''
        run: |
          set -euo pipefail
          BUNDLE="$GITHUB_WORKSPACE/aioncore-bundle"
          BIN="$GITHUB_WORKSPACE/aioncore-src/target/$RUST_TARGET/release/aioncore"

          test -f "$BIN" || { echo "::error::aioncore was not produced at $BIN"; exit 1; }

          rm -rf "$BUNDLE"
          mkdir -p "$BUNDLE"
          cp "$BIN" "$BUNDLE/aioncore"
          chmod +x "$BUNDLE/aioncore"

          # managed-resources/ (including its manifest.json) is generated by the
          # binary itself; verifyPreparedAioncoreBundle rejects a bundle without it.
          "$BUNDLE/aioncore" --data-dir "$RUNNER_TEMP/aioncore-prepare-data" \
            prepare-managed-resources --bundle-out "$BUNDLE/managed-resources"

          test -f "$BUNDLE/managed-resources/manifest.json" || {
            echo "::error::managed-resources/manifest.json missing — bundle would be rejected"; exit 1; }

          # migration-lineage.json is NOT produced by the binary; prepare-aioncore's
          # local-bundle path (and Sprint 4's migreset gate) require it beside the
          # binary and deep-equal to packages/shared-scripts/src/aioncore-migration-lineage.json.
          LINEAGE_SRC="$GITHUB_WORKSPACE/packages/shared-scripts/src/aioncore-migration-lineage.json"
          test -f "$LINEAGE_SRC" || { echo "::error::$LINEAGE_SRC missing"; exit 1; }
          cp "$LINEAGE_SRC" "$BUNDLE/migration-lineage.json"

          echo "AIONUI_BACKEND_LOCAL_BUNDLE_DIR=$BUNDLE" >> "$GITHUB_ENV"
          echo "Bundle ready at $BUNDLE"

      - name: Bundle officecli (offline Office document features)
        shell: bash
        env:
          # Pinned OfficeCli release; digest mirrors prepareBundledOfficecli in
          # prepare-aioncore.js so this standalone macOS build ships the same
          # officecli the reusable pipeline does. prepare-managed-resources does
          # not produce office/, so add it here (fail-closed on digest mismatch).
          OFFICECLI_VERSION: v1.0.143
          OFFICECLI_ASSET: officecli-mac-x64
          OFFICECLI_SHA256: 693d243db616c74705fec9d92fdfc8a3db36acfcea378edb7264c2a30d339d9c
        run: |
          set -euo pipefail
          OFFICE_DIR="$AIONUI_BACKEND_LOCAL_BUNDLE_DIR/managed-resources/office"
          mkdir -p "$OFFICE_DIR"
          URL="https://github.com/iOfficeAI/OfficeCli/releases/download/${OFFICECLI_VERSION}/${OFFICECLI_ASSET}"
          curl -fSL --retry 5 --retry-delay 3 -o "$OFFICE_DIR/officecli" "$URL"
          chmod +x "$OFFICE_DIR/officecli"
          ACTUAL=$(shasum -a 256 "$OFFICE_DIR/officecli" | awk '{print $1}')
          if [ "$ACTUAL" != "$OFFICECLI_SHA256" ]; then
            echo "::error::officecli digest mismatch: expected $OFFICECLI_SHA256, got $ACTUAL"; exit 1
          fi
          echo "Bundled officecli ${OFFICECLI_VERSION} -> $OFFICE_DIR/officecli ($ACTUAL)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Bake Microsoft SSO config (optional)
        shell: bash
        env:
          SSO_CONFIG_B64: ${{ inputs.sso_config_b64 }}
        run: |
          set -euo pipefail
          if [ -z "${SSO_CONFIG_B64}" ]; then
            echo "No sso_config_b64 provided — SSO stays dormant in this build."
            exit 0
          fi
          mkdir -p resources
          printf '%s' "${SSO_CONFIG_B64}" | base64 -d > resources/sso-config.json
          node -e "const c=require('./resources/sso-config.json'); if(!c.tenantId||!c.clientId){console.error('::error::sso-config.json missing tenantId/clientId');process.exit(1)} console.log('SSO config baked: tenant '+String(c.tenantId).slice(0,8)+'… client '+String(c.clientId).slice(0,8)+'…')"

      - name: Assert built-in provider keys present
        shell: bash
        env:
          FORGE_GREENNODE_API_KEY: ${{ secrets.FORGE_GREENNODE_API_KEY }}
          FORGE_TAVILY_API_KEY: ${{ secrets.FORGE_TAVILY_API_KEY }}
        run: |
          set -euo pipefail
          [ -n "${FORGE_GREENNODE_API_KEY}" ] || { echo "::error::FORGE_GREENNODE_API_KEY secret missing — GreenNode would not seed. Add it in repo Settings → Secrets."; exit 1; }
          [ -n "${FORGE_TAVILY_API_KEY}" ] || { echo "::error::FORGE_TAVILY_API_KEY secret missing — web search would not seed."; exit 1; }
          echo "Built-in provider keys present (values not printed)."

      - name: Build the installer
        shell: bash
        env:
          # Internal-release path: ad-hoc code signing (identity '-'), no notarization
          # and no CSC/APPLE credentials — the customer notarizes on their side. This
          # mirrors the local build-mac-x64 flow.
          WEPROMPT_INTERNAL_RELEASE: '1'
          AIONUI_BACKEND_ARCH: x64
          NODE_OPTIONS: '--max-old-space-size=8192'
          # Built-in provider keys baked at build time (mirrors _build-reusable.yml).
          FORGE_GREENNODE_API_KEY: ${{ secrets.FORGE_GREENNODE_API_KEY }}
          FORGE_TAVILY_API_KEY: ${{ secrets.FORGE_TAVILY_API_KEY }}
        run: bun run build-mac:x64

      - name: Verify the backend shipped came from the local bundle
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="resources/bundled-aioncore/darwin-x64/manifest.json"
          test -f "$MANIFEST" || { echo "::error::$MANIFEST missing"; exit 1; }
          cat "$MANIFEST"
          node -e "
            const m = require('./$MANIFEST');
            if (m.sourceType !== 'local-bundle') {
              console.error('::error::backend sourceType is ' + m.sourceType + ', expected local-bundle — the installer would ship an upstream build');
              process.exit(1);
            }
            console.log('backend sourceType OK: local-bundle');
          "

      - name: Locate the installer
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          INSTALLER=$(find out -maxdepth 1 -name 'WePrompt-*-mac-x64.dmg' -print -quit)
          test -n "$INSTALLER" || { echo "::error::no WePrompt-*-mac-x64.dmg found in out/"; ls -la out || true; exit 1; }
          echo "path=$INSTALLER" >> "$GITHUB_OUTPUT"
          ls -lh "$INSTALLER"

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: weprompt-mac-x64
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 14
